<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Tapper - Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body id="bodyCatRem">
    <section id="bodySection">
        <header>
            <h1>Cat Tapper Remake</h1>
            <h2>Gallery</h2>
        </header>
        <section class="itemSec">
            <div class="picDiv">
                <img alt="Picture of Menu" src="assets/CatTapperRemakeGallery/CatRMenu.png">
            </div>
            <div class="picBio">
                <p>The Menu for Cat Tapper Remake.</p>
            </div>
        </section>

        <section class="itemSec">
            <div class="picDiv">
                <img alt="Picture of Easy Level" src="assets/CatTapperRemakeGallery/CatRLevelEasy.png">
            </div>
            <div class="picBio">
                <p>This is one of the levels.</p>
            </div>
        </section>

        <section class="itemSec">
            <div class="picDiv">
                <img alt="Picture of Kings Rock Level" src="assets/CatTapperRemakeGallery/CatRKingsRock.png">
            </div>
            <div class="picBio">
                <p>This is another one of the levels.</p>
            </div>
        </section>

        <section class="itemSec">
            <div class="picDiv">
                <img alt="Picture of Result Screen" src="assets/CatTapperRemakeGallery/CatRResult.png">
            </div>
            <div class="picBio">
                <p>The result screen after the game ends.</p>
            </div>
        </section>

        <section class="itemSec">
            <div class="picDiv">
                <img id="bigScreen" alt="Picture of Menu in Tablet Mode" src="assets/CatTapperRemakeGallery/CatRMenuTabletMode.png">
            </div>
            <div class="picBio">
                <p>This is how the game looks like on a bigger screen.</p>
            </div>
        </section>
    </section>
</body>
</html>
